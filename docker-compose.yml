services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: ems-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP - ovde Spring Boot šalje mejlove
      - "8025:8025"   # Web UI - ovde pregledaš primljene mejlove
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  # Oracle XE — PL/SQL modul (database/oracle/). Spring Boot i dalje koristi MySQL.
  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: ems-oracle-xe
    restart: unless-stopped
    ports:
      - "1522:1521"   # 1522 spolja ako je 1521 zauzet (lokalni Oracle)
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: ems
      APP_USER_PASSWORD: ems
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  oracle-data:
