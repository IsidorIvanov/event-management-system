spring.application.name=event-management-system
spring.config.import=optional:file:.env[.properties]
spring.jpa.open-in-view=false
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

server.port=${SERVER_PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Mail (Mailpit za lokalni razvoj)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${MAIL_FROM:noreply@eventsystem.local}

app.storage.root=./storage

# Oracle PL/SQL sidecar (F3) — iskljuceno po defaultu
app.oracle.enabled=${ORACLE_ENABLED:false}
app.oracle.url=${ORACLE_URL:jdbc:oracle:thin:@localhost:1522/XEPDB1}
app.oracle.username=${ORACLE_USERNAME:ems}
app.oracle.password=${ORACLE_PASSWORD:ems}